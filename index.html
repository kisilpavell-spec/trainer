dumb down", "ipa": "/ˌdʌm ˈdaʊn/", "ru": "упростить до примитива", "en": "Don’t dumb it down for me.", "er": "Не упрощай для меня."}];
const PART=["up","out","on","off","down","over","in","around","away","by","apart","behind","back","about"];
let mode="cards",known=new Set(),score=0,total=0,streak=0,cur=null,flip=false;
try{known=new Set(JSON.parse(localStorage.getItem("pv_known")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("pv_known",JSON.stringify([...known]))}catch(e){}};
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
 mode=b.dataset.m;score=0;total=0;streak=0;next()});
function bar(){ $("bar").innerHTML= mode==="cards" ? `<span>Знаю: ${known.size} из ${D.length}</span><span></span>` : `<span>Верно: ${score} из ${total}</span><span>Серия: ${streak}</span>`}
function next(){bar();({cards:cards,tr:tr,gap:gap})[mode]()}
function cards(){
 const pool=D.filter((d,i)=>!known.has(i));
 if(!pool.length){$("main").innerHTML='<div class="card"><div class="v">Все 127 выучены 🎉</div><div class="row"><button class="btn" id="rs">Начать заново</button></div></div>';$("rs").onclick=()=>{known.clear();save();next()};return}
 cur=rnd(pool);flip=false;drawCard();
}
function slug(v){return clean(v).trim().toLowerCase().replace(/\s+/g,"-")}
function grad(v){let h=0;for(const c of v)h=(h*31+c.charCodeAt(0))%360;
 return `radial-gradient(circle at 80% 20%,hsla(${(h+40)%360},90%,70%,.9) 0,transparent 28%),radial-gradient(circle at 15% 85%,hsla(${(h+200)%360},80%,55%,.6) 0,transparent 40%),linear-gradient(135deg,hsl(${h},65%,42%),hsl(${(h+60)%360},70%,26%))`}
function drawCard(){
 const d=cur;
 $("main").innerHTML=`<div class="card bg" id="c" style="cursor:pointer;background-image:${grad(d.v)}">${flip?
 `<div class="ru">${esc(d.ru)}</div><div class="v" style="font-size:22px;margin-top:8px">${esc(d.v)}</div><div><span class="ipa tap" id="ip">${esc(d.ipa)}</span></div><div class="ex tap" id="ex">${esc(d.en)}</div><div class="exr">${esc(d.er)}</div><div class="tip">Нажмите на транскрипцию или предложение, чтобы послушать</div>`:
 `<div class="v">${esc(d.v)}</div><div class="ipa">${esc(d.ipa)}</div><div class="hint">Нажмите, чтобы увидеть перевод</div>`}</div>
 ${flip?'<div class="row"><button class="btn no" id="n">Ещё повторить</button><button class="btn ok" id="k">Знаю</button></div>':''}`;
 const im=new Image();im.onload=()=>{const c=$("c");if(c&&cur===d)c.style.backgroundImage=`url("${im.src}")`};im.src="img/"+slug(d.v)+".jpg";
 $("c").onclick=()=>{if(!flip){flip=true;drawCard();say(clean(cur.v))}};
 if(flip){$("ip").onclick=e=>{e.stopPropagation();say(clean(d.v))};$("ex").onclick=e=>{e.stopPropagation();say(d.en,.85)};
  $("n").onclick=cards;$("k").onclick=()=>{known.add(D.indexOf(cur));save();next()}}
}
function choice(q,ans,opts,after){
 $("main").innerHTML=`<div class="card">${q}</div><div class="opts" id="o"></div>`;
 shuf(opts).forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;
  b.onclick=()=>{if(b.dataset.d)return;total++;const ok=t===ans;score+=ok;streak=ok?streak+1:0;
   [...$("o").children].forEach(x=>{x.dataset.d=1;if(x.textContent===ans)x.classList.add("good")});if(!ok)b.classList.add("wrong");
   bar();after(ok)};$("o").appendChild(b)});
}
function nextBtn(){const b=document.createElement("button");b.className="btn";b.style.marginTop="4px";b.textContent="Дальше →";b.onclick=next;$("o").appendChild(b)}
function tr(){
 cur=rnd(D);const wrong=shuf(D.filter(d=>d.ru!==cur.ru)).slice(0,3).map(d=>d.ru);
 choice(`<div class="v">${esc(cur.v)}</div><div class="ipa">${esc(cur.ipa)}</div><div class="hint">Что это значит?</div>`,cur.ru,[cur.ru,...wrong],()=>nextBtn());
}
function gap(){
 let it=null,re=null;
 for(let i=0;i<60&&!it;i++){const d=rnd(D);const w=d.v.replace(/\s*\(.*\)/,"").split(" ");
  if(w.length<2)continue;const p=w[1];re=new RegExp("\\b"+p+"\\b","i");if(re.test(d.en)){it=d;it.p=p}}
 cur=it;const s=esc(cur.en).replace(re,'<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;</span>');
 const wrong=shuf(PART.filter(x=>x!==cur.p)).slice(0,3);
 choice(`<div class="q">${s}</div><div class="exr" style="margin-top:8px">${esc(cur.er)}</div><div class="hint">${esc(cur.v.split(" ")[0])} … ? Выберите частицу</div>`,cur.p,[cur.p,...wrong],()=>nextBtn());
}
const clean=s=>s.replace(/\s*\(.*\)/,"");
let VOICE=null;
function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
 const pref=["Samantha","Ava","Allison","Google US English","Aria","Jenny","Zira","Alex"];
 VOICE=pref.map(n=>vs.find(v=>v.name.includes(n))).find(Boolean)||vs[0]||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,r){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(VOICE)u.voice=VOICE;u.rate=r||.9;speechSynthesis.speak(u)}
next();
</script></body></html>
