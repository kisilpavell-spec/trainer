<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost on the Island: игра на фразовых глаголах</title>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2433;--mute:#5d667a;--line:#e0dbcd;--acc:#c2410c;--ok:#2b8a3e;--bad:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1b202b;--ink:#eceff6;--mute:#9aa3b8;--line:#2d3445;--acc:#ff9a5c;--ok:#6fcf86;--bad:#ff8787;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1b202b;--ink:#eceff6;--mute:#9aa3b8;--line:#2d3445;--acc:#ff9a5c;--ok:#6fcf86;--bad:#ff8787;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,"Times New Roman",serif}
.w{max-width:640px;margin:0 auto;padding:18px 14px 40px}
h1{font:700 24px/1.2 system-ui,sans-serif;margin:0 0 2px}.sub{font:14px system-ui,sans-serif;color:var(--mute);margin:0 0 14px}
.bar{display:flex;justify-content:space-between;font:14px system-ui,sans-serif;color:var(--mute);margin-bottom:8px}.hr{color:var(--bad);letter-spacing:2px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.st{margin:0 0 12px}.pr{margin:0;font-weight:700;font-size:19px}
.gap{border-bottom:3px solid var(--acc);color:var(--acc);padding:0 4px}
.hint{font:14px system-ui,sans-serif;color:var(--mute);margin-top:12px}
.opts{display:grid;gap:8px;margin-top:12px}
button{font:600 16px system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.opt.good{background:var(--ok);border-color:var(--ok);color:#fff}.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;font-size:14px;text-align:center}
.fb{margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.fb.g{border-color:var(--ok)}.fb.r{border-color:var(--bad)}.fb b{font-family:system-ui,sans-serif}
.fact{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font:15px/1.5 system-ui,sans-serif;color:var(--mute)}
.pri{background:var(--acc);border-color:var(--acc);color:#fff;margin-top:10px;width:100%;text-align:center}
.rv{font:15px/1.5 system-ui,sans-serif;margin:6px 0}.rk{font-size:22px;font-weight:700;margin:6px 0}
h2{font:700 17px system-ui,sans-serif;margin:16px 0 4px}
</style></head><body><div class="w">
<h1>Lost on the Island</h1><p class="sub">Игра № 4 · выживание. Выбирайте верные фразовые глаголы и дождитесь спасения.</p>
<div id="app"></div></div>
<script>
const S=[{"t": "Gray light. Waves. You open your eyes and feel sand under your face. Your small sailing boat is gone. You are alone on a beach, and the sun is already high.", "g": "Slowly, you ___. Your head hurts, but you are alive.", "o": ["wake up", "show up", "cut off"], "c": 0, "ok": "You sit up and look around. The island is quiet.", "no": "The word is wrong, but the idea is clear: you slowly come back to life.", "fact": "Есть известное «правило троек»: примерно 3 минуты без воздуха, 3 часа без укрытия в плохих условиях, 3 дня без воды и 3 недели без еды. Это ориентиры, а не точные сроки.", "ru": "Серый рассвет. Вы открываете глаза: под лицом песок. Лодки нет. Вы медленно просыпаетесь. Голова болит, но вы живы. wake up = проснуться, очнуться."}, {"t": "You see no people, only palm trees and rocks. Your heart is racing. You can hear your own breath.", "g": "You tell yourself: “___. Think. Water first.”", "o": ["Calm down", "Hang up", "Back up"], "c": 0, "ok": "You breathe slowly. Your mind becomes clearer.", "no": "You lose a few minutes in panic, but finally you can think.", "fact": "Если нарастает паника, помогает медленное дыхание: вдох на четыре счёта, выдох на шесть. В такой ситуации первым делом думают о воде и укрытии.", "ru": "Вокруг только пальмы и скалы. Сердце колотится. Вы говорите себе: «Успокойся. Думай. Сначала вода». calm down = успокоиться."}, {"t": "You walk along the beach. Behind the rocks, you see green plants and wet ground.", "g": "Near the rocks, you ___ a small stream of fresh water.", "o": ["come across", "come over", "come out"], "c": 0, "ok": "You taste a little. It looks clean, but you decide to be careful.", "no": "You almost miss the stream, but the sound of water leads you to it.", "fact": "Воду из неизвестного источника по возможности кипятят или фильтруют. Если такой возможности нет, это риск для здоровья.", "ru": "Вы идёте вдоль пляжа. За скалами видите зелень и влажную землю. У скал вы наталкиваетесь на небольшой ручей. come across = наткнуться, случайно найти."}, {"t": "In your wet backpack you find a lighter, a knife, two energy bars and a small bottle of water. That is not much.", "g": "After two days, you ___ food. Now you must find more.", "o": ["run out of", "run into", "run away"], "c": 0, "ok": "You look at the empty wrapper and think about fruit and fish.", "no": "You get confused for a moment, but the situation is clear: no food left.", "fact": "Не рискуйте с незнакомыми ягодами и грибами: многие из них ядовиты. Без еды человек может обойтись дольше, чем без воды и тепла.", "ru": "В мокром рюкзаке зажигалка, нож, два батончика и бутылка воды. Через два дня у вас кончается еда. run out of = закончиться, исчерпать запас."}, {"t": "At night, it rains. The wind shakes the palm trees. Your shelter of branches leaks, and you cannot sleep.", "g": "You can’t change the weather, so you ___ it until morning.", "o": ["put up with", "put off", "put on"], "c": 0, "ok": "It is a long night, but you stay dry enough to rest a little.", "no": "The wrong word makes it confusing, but the meaning is simple: you must endure the night.", "fact": "Сырость и ветер могут быть опасны из-за переохлаждения даже в тёплую погоду, поэтому укрытие часто важнее еды.", "ru": "Ночью дождь и ветер. Шалаш из веток протекает, спать невозможно. Вы ничего не можете сделать с погодой, поэтому терпите до утра. put up with = мириться, терпеть."}, {"t": "In the morning, you hear a weak voice. A young man named Sam lies behind the rocks. His leg is hurt, and he is very pale.", "g": "You decide to ___ him until he can walk.", "o": ["look after", "look out", "look up"], "c": 0, "ok": "You bring him water and make a splint from two branches.", "no": "You hesitate, but the choice is clear: you cannot leave him alone.", "fact": "При травме ноги её важно обездвижить и не нагружать. Это общий принцип, настоящую помощь окажет врач.", "ru": "Утром вы слышите слабый голос. За камнями лежит молодой человек Сэм, у него повреждена нога. Вы решаете позаботиться о нём, пока он не сможет ходить. look after = присматривать, заботиться."}, {"t": "On the fourth day, you see a ship far away. Your signal fire is small and weak.", "g": "“___ for a little longer!” Sam shouts. “They may see the smoke!”", "o": ["Hold on", "Back off", "Give in"], "c": 0, "ok": "You add green branches, and the smoke becomes thick and white.", "no": "Sam’s words are strong, but the idea is simple: keep the fire going.", "fact": "Днём сигнальный костёр делают дымным (добавляют зелёные ветки), а ночью ярким. Три огня или три сигнала считаются международным знаком бедствия.", "ru": "На четвёртый день вы видите далеко корабль. Сигнальный огонь слабый. «Держись ещё немного!» кричит Сэм. «Они могут увидеть дым!» hold on = держаться, потерпеть."}, {"t": "The ship does not see you. Sam is weak and worried. He says: “What if nobody comes?”", "g": "You answer: “You can ___ me. We will get through this together.”", "o": ["count on", "count out", "count down"], "c": 0, "ok": "Sam smiles for the first time in days.", "no": "Sam understands the idea anyway: you promise to stay with him.", "fact": "Поддержка и ясный план действий помогают сохранять надежду. Это известный совет для сложных ситуаций: не оставляйте людей одних.", "ru": "Корабль вас не заметил. Сэм слаб и встревожен: «А если никто не придёт?» Вы отвечаете: «Ты можешь на меня рассчитывать. Мы справимся вместе». count on = рассчитывать на."}, {"t": "Day seven. You build a big “SOS” on the beach from stones and wood. This time, a rescue plane flies over the island.", "g": "Your plan finally ___. The plane turns and comes back.", "o": ["works out", "works on", "works off"], "c": 0, "sp": "work out", "ok": "A helicopter arrives an hour later. You and Sam are going home.", "no": "The word is wrong, but the result is the same: the plane sees your sign.", "fact": "Знак SOS или большие буквы на открытом месте видны с воздуха. Чем крупнее и контрастнее знак, тем лучше.", "ru": "Седьмой день. Вы выкладываете на пляже огромное «SOS» из камней и дерева. Над островом летит спасательный самолёт. Ваш план наконец сработал. work out = получиться, сработать."}];
const END=["The island wins this time. Try again.", "You survive, but it was a close call.", "You are rescued. Sam says: “Thanks for staying.”", "Perfect survival! The rescue team calls you a natural leader."];
const REVEAL=`<h2>Глаголы этой игры</h2>
<p class="rv">wake up: проснуться. calm down: успокоиться. come across: наткнуться. run out of: закончиться. put up with: терпеть. look after: заботиться. hold on: держаться. count on: рассчитывать на. work out: сработать.</p>
<h2>Что запомнить из советов</h2>
<p class="rv">Первым делом думают о воде и укрытии. Не рискуйте с неизвестной едой и водой. Подавайте сигнал так, чтобы его было видно сверху. Не теряйте спокойствие и держитесь вместе.</p>
<h2>Что выдумано</h2>
<p class="rv">Остров, Сэм и вся история вымышлены для игры. Это не руководство по выживанию: советы общие. В реальной ситуации ориентируйтесь на рекомендации спасателей и официальные инструкции.</p>`;
let i=0,h=3,hints=0,log=[],locked=false;
const $=id=>document.getElementById(id);
const gap=(s,f)=>s.g.includes("___")?s.g.replace("___",'<span class="gap">'+(f?s.o[s.c]:"&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;")+"</span>"):s.g;
const SS="speechSynthesis" in window,PITCH=.9;let SND=true,TOK=0,VOICE=null;
function chooseVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
 const pref=["Andrew","Brian","Guy","Christopher","Eric","Davis","Evan","Tom","Alex","Aaron","Daniel","Google UK English Male","Fred","Arthur","David","Mark"];
 const q=v=>/natural|premium|enhanced|neural|online/i.test(v.name)?0:1;
 VOICE=null;for(const n of pref){const m=vs.filter(x=>x.name.includes(n)).sort((a,b)=>q(a)-q(b));if(m.length){VOICE=m[0];break}}
 VOICE=VOICE||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs[0]||null}
if(SS){chooseVoice();speechSynthesis.onvoiceschanged=chooseVoice}
function speak(seq){if(!SS||!SND)return;speechSynthesis.cancel();const tk=++TOK;let k=0;
 const go=()=>{if(tk!==TOK||k>=seq.length)return;const p=seq[k++];
  setTimeout(()=>{if(tk!==TOK)return;const u=new SpeechSynthesisUtterance(p.t);u.lang="en-US";if(VOICE)u.voice=VOICE;u.rate=p.r;u.pitch=p.p||PITCH;u.volume=1;u.onend=go;u.onerror=go;speechSynthesis.speak(u)},p.d||0)};go()}
function seqFor(s){const o=[],cl=x=>x.replace(/[“”"]/g,"").trim();
 (s.t.match(/[^.!?]+[.!?]*”?\s*/g)||[s.t]).forEach(x=>{const q=x.trim().startsWith("“"),e=x.includes("!"),w=x.includes("?");
  o.push({t:x,r:e?.84:.78,p:PITCH+(q?.1:0)+(e?.1:0)+(w?.12:0),d:300})});
 if(s.g.includes("___")){const [a,b]=s.g.split("___");if(/\w/.test(cl(a)))o.push({t:cl(a),r:.78,p:PITCH+.05,d:600});if(/\w/.test(cl(b)))o.push({t:cl(b),r:.78,p:PITCH+.05,d:900})}
 else o.push({t:s.g,r:.78,p:PITCH+.12,d:600});
 return o}
const vp=s=>s.sp||s.o[s.c].toLowerCase();
function buzz(){try{const H=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback;if(H){H.notificationOccurred("success");return}}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([40,40,70])}catch(e){}}
window.addEventListener("load",()=>{try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}});
function start(){i=0;h=3;hints=0;log=[];show()}
function show(){
 const s=S[i];locked=false;let hinted=false;
 $("app").innerHTML=`<div class="bar"><span>Scene ${i+1} of ${S.length}</span><span class="hr">${"♥".repeat(h)+"♡".repeat(3-h)}</span></div>
 <div class="card"><p class="st">${s.t}</p><p class="pr" id="pr">${gap(s,false)}</p><div class="hint" id="hint"></div></div>
 <div class="opts" id="o"></div><div class="row"><button id="hb">Подсказка</button><button id="ls">Слушать</button></div><div id="fb"></div>`;
 [0,1,2].map(k=>[Math.random(),k]).sort((p,q)=>p[0]-q[0]).forEach(([,k])=>{const b=document.createElement("button");b.className="opt";b.textContent=s.o[k];b.onclick=()=>pick(k,b);$("o").appendChild(b)});
 $("hb").onclick=()=>{if(!hinted){hinted=true;hints++}$("hint").textContent=s.ru};
 $("ls").onclick=()=>speak(seqFor(s));
}
function pick(k,b){
 const s=S[i];if(locked){if(k===s.c)speak([{t:vp(s),r:.7}]);return}locked=true;const ok=k===s.c;if(!ok)h--;log.push({v:s.o[s.c],ok});
 [...$("o").children].forEach(x=>{if(x.textContent===s.o[s.c])x.classList.add("good")});if(!ok)b.classList.add("bad");
 $("pr").innerHTML=gap(s,true);
 speak([{t:vp(s),r:.7}]);if(ok)buzz();
 const last=h<=0||i===S.length-1;
 $("fb").innerHTML=`<div class="fb ${ok?"g":"r"}"><b>${ok?"Correct.":"Not quite."}</b> ${ok?s.ok:s.no}${ok?"":`<br><span class="hint">Правильный ответ: <b>${s.o[s.c]}</b></span>`}<div class="fact"><b>Совет по выживанию:</b> ${s.fact}</div></div><button class="pri" id="nx">${last?"Финал":"Дальше"}</button>`;
 $("nx").onclick=()=>{if(last)end();else{i++;show()}};
}
function end(){
 const won=h>0;
 $("app").innerHTML=`<div class="card"><p class="rk">${won?"Rescued!":"Not this time"}</p><p class="st">${END[h]}</p>
 <p class="rv">Жизней осталось: ${h} из 3. Подсказок использовано: ${hints}.</p><p class="rv"><b>Ваши глаголы:</b></p>
 ${log.map(x=>`<p class="rv">${x.ok?"✓":"✗"} ${x.v}</p>`).join("")}</div>
 <div class="card" style="margin-top:12px">${REVEAL}</div><button class="pri" id="rs">Играть заново</button>`;
 $("rs").onclick=start;
}
start();
</script></body></html>
