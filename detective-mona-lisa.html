<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Stole the Mona Lisa? A phrasal verb detective game</title>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2433;--mute:#5d667a;--line:#e0dbcd;--acc:#c2410c;--ok:#2b8a3e;--bad:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1b202b;--ink:#eceff6;--mute:#9aa3b8;--line:#2d3445;--acc:#ff9a5c;--ok:#6fcf86;--bad:#ff8787;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1b202b;--ink:#eceff6;--mute:#9aa3b8;--line:#2d3445;--acc:#ff9a5c;--ok:#6fcf86;--bad:#ff8787;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,"Times New Roman",serif}
.w{max-width:640px;margin:0 auto;padding:18px 14px 40px}
h1{font:700 24px/1.2 system-ui,sans-serif;margin:0 0 2px}.sub{font:14px system-ui,sans-serif;color:var(--mute);margin:0 0 14px}
.bar{display:flex;justify-content:space-between;font:14px system-ui,sans-serif;color:var(--mute);margin-bottom:8px}.hr{color:var(--bad);letter-spacing:2px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.st{margin:0 0 12px}.pr{margin:0;font-weight:700;font-size:19px}
.gap{border-bottom:3px solid var(--acc);color:var(--acc);padding:0 4px}
.hint{font:14px system-ui,sans-serif;color:var(--mute);margin-top:12px}
.opts{display:grid;gap:8px;margin-top:12px}
button{font:600 16px system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.opt.good{background:var(--ok);border-color:var(--ok);color:#fff}.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;font-size:14px;text-align:center}
.fb{margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.fb.g{border-color:var(--ok)}.fb.r{border-color:var(--bad)}.fb b{font-family:system-ui,sans-serif}
.fact{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font:15px/1.5 system-ui,sans-serif;color:var(--mute)}
.pri{background:var(--acc);border-color:var(--acc);color:#fff;margin-top:10px;width:100%;text-align:center}
.rv{font:15px/1.5 system-ui,sans-serif;margin:6px 0}.rk{font-size:22px;font-weight:700;margin:6px 0}
h2{font:700 17px system-ui,sans-serif;margin:16px 0 4px}
</style></head><body><div class="w">
<h1>Who Stole the Mona Lisa?</h1><p class="sub">Дело № 1 · реальная история 1911 года. Выбирайте фразовые глаголы и раскройте тайну.</p>
<div id="app"></div></div>
<script>
const S=[
{t:"You are a Paris detective. It is Tuesday, 22 August 1911. The painter Louis Béroud comes to the Louvre to work, but the wall where the Mona Lisa hangs is empty. A guard says: “It’s with the photographers.” It isn’t.",g:"You order the guards: “___ the painting in every room!”",o:["Look for","Look out","Look up to"],c:0,ok:"Every room, every corridor. Nothing. The Mona Lisa is really gone.",no:"You send the guards the wrong way and lose an hour.",fact:"Лувр по понедельникам закрыт, поэтому кража произошла 21 августа. Пропажу заметили только через сутки.",ru:"Вы парижский детектив. Вторник, 22 августа 1911 года. Художник Луи Беру пришёл в Лувр работать, но на стене, где висела «Мона Лиза», пусто. Охранник думал, что картина у фотографов. Это не так. look for = искать."},
{t:"A guard finds the empty frame and glass in a service staircase. The thief took only the painting. It is small, and it is painted on a wooden panel.",g:"Nobody saw him ___ the building with it.",o:["get out of","give up","turn down"],c:0,ok:"The painting is easy to hide under a coat. He simply walked out.",no:"You look for a trick with ropes and windows. The truth is much simpler.",fact:"«Мона Лиза» небольшая: около 77 на 53 сантиметров, написана на тополевой доске.",ru:"В служебной лестнице нашли пустую раму и стекло. Вор взял только картину, она небольшая. Никто не видел, как он вышел из здания с ней. get out of = выйти, выбраться из."},
{t:"The Louvre closes for a week. On Monday, many workers were inside in white smocks, so a man in a smock looked completely normal.",g:"You need to ___ who was in the building that morning.",o:["find out","run out","break out"],c:0,ok:"The list is long: workers, guards, cleaners. Someone on it knows the building very well.",no:"You guess instead of checking the staff lists, and the list grows longer.",fact:"После кражи руководитель музея потерял должность, а газеты по всему миру сделали картину знаменитой.",ru:"Лувр закрыли на неделю. В понедельник внутри работали рабочие в белых халатах, поэтому человек в халате выглядел обычно. Нужно выяснить, кто был в здании. find out = выяснить."},
{t:"A new lead: Géry Pieret, a Belgian adventurer, had stolen small statues from the Louvre before and sold them to the painter Pablo Picasso. The poet Guillaume Apollinaire, Pieret’s friend, is arrested. Picasso is questioned too.",g:"After hard questions, you ___ both men as suspects.",o:["rule out","set up","pull off"],c:0,ok:"Neither man took the painting. Both are released.",no:"You keep chasing the wrong men while the real thief stays calm and free.",fact:"Аполлинер провёл за решёткой несколько дней. По некоторым свидетельствам, Пикассо так испугался, что расплакался на допросе.",ru:"Бельгиец Жери Пьере воровал из Лувра статуэтки и продавал их Пикассо. Поэта Аполлинера арестовали, Пикассо допросили. После допросов вы исключаете обоих из подозреваемых. rule out = исключить."},
{t:"Months pass, then years. People come to the Louvre just to look at the empty space on the wall. The police have no new clues. Your chief says: “Close the file.”",g:"But you refuse to ___.",o:["give up","give out","give away"],c:0,ok:"You keep one small note on your desk: “Someone will try to sell it.”",no:"You close the file. The case sleeps, but luckily it wakes up on its own.",fact:"Толпы людей действительно приходили смотреть на пустую стену. Кража сделала «Мону Лизу» знаменитее, чем когда-либо.",ru:"Проходят месяцы и годы. Люди приходят в Лувр посмотреть на пустое место. Шеф говорит закрыть дело, но вы отказываетесь. give up = сдаваться."},
{t:"November 1913. A letter arrives for Alfredo Geri, an art dealer in Florence. The sender signs it “Leonardo” and offers to sell the Mona Lisa. Geri speaks to the director of the Uffizi Gallery.",g:"Together they decide to ___ a meeting with the seller.",o:["set up","set off","set out"],c:0,ok:"The seller agrees to come to Florence with the painting.",no:"The plan sounds confusing and the seller gets nervous, but he still agrees.",fact:"Письмо было подписано «Леонардо», а продавец просил очень крупную сумму.",ru:"Ноябрь 1913. Флорентийский антиквар Альфредо Джери получает письмо, подписанное «Леонардо»: автор предлагает купить «Мону Лизу». Они решают организовать встречу. set up = организовать."},
{t:"In a small hotel room in Florence, a man opens a wooden trunk. Under old clothes and tools lies the Mona Lisa. Geri studies it carefully.",g:"He and the Uffizi director quickly ___ that this is the real painting.",o:["figure out","pass out","wear off"],c:0,ok:"It is real. They stay calm and say they need time to bring the money.",no:"Doubt makes them slow, but in the end they recognize it.",fact:"Вор больше двух лет прятал картину в своей парижской комнате.",ru:"В маленьком номере отеля во Флоренции мужчина открывает деревянный сундук. Под старой одеждой лежит «Мона Лиза». Они быстро понимают, что картина настоящая. figure out = понять."},
{t:"Geri leaves the room calmly. He doesn’t want the seller to run.",g:"Outside, he quietly ___ the police.",o:["tips off","kicks out","rips off"],c:0,sp:"tip off",ok:"Officers arrive. The man is arrested: his name is Vincenzo Peruggia, an Italian who once worked at the Louvre.",no:"A small delay! But the police still find the man at his hotel.",fact:"Винченцо Перуджа раньше работал в Лувре и хорошо знал здание.",ru:"Джери спокойно выходит из комнаты, он не хочет, чтобы продавец сбежал. На улице он тихо предупреждает полицию. tip off = тайно предупредить."},
{t:"In court, Vincenzo Peruggia says he did it for his country: he believed the Mona Lisa belonged in Italy. Many Italians supported him. The painting is shown in Italy, and then it is time to send it home.",g:"The Mona Lisa will ___ to the Louvre.",o:["go back","back off","go on"],c:0,ok:"In early 1914, the painting hangs in the Louvre again.",no:"Almost. The painting returns anyway, because the whole world is waiting.",fact:"Перуджа получил срок меньше года. Он утверждал, что вернул картину Италии, но это ошибка: Леонардо сам увёз её во Францию, а не Наполеон.",ru:"В суде Перуджа говорит, что сделал это ради своей страны. Картину показывают в Италии, а затем отправляют домой. go back = вернуться."}];
const END=["Your chief takes you off the case. Try again.","Case solved, but with mistakes.","Case solved. The chief says: “Good work, but stay sharp.”","Perfect work. You are promoted to Chief Inspector."];
const REVEAL=`<h2>Что было на самом деле</h2>
<p class="rv">21 августа 1911 года Винченцо Перуджа, итальянец, работавший в Лувре, вынес «Мону Лизу» из музея. Раму нашли на лестнице. Картина почти ничего не весит, и вор просто ушёл с ней.</p>
<p class="rv">Она провела больше двух лет в его парижской комнате. В конце 1913 года он предложил её флорентийскому антиквару, и Перуджу арестовали. Он говорил, что хотел вернуть шедевр Италии, но историки сомневаются, что это был единственный мотив: он просил за картину деньги.</p>
<h2>Что неизвестно</h2>
<p class="rv">Позже появилась история, будто аферист заказал копии картины, чтобы продать их коллекционерам. Достоверно она не доказана, поэтому относитесь к ней как к легенде.</p>
<h2>Что выдумано</h2>
<p class="rv">Диалоги, роль детектива «от первого лица» и мелкие детали сцен придуманы для игры. Даты и основные участники взяты из общеизвестных источников, но читали вы пересказ, а не документ.</p>
<h2>Где проверить</h2>
<p class="rv">Сайт Лувра, статья «Мона Лиза» в Британской энциклопедии, материалы Smithsonian Magazine о краже и книга Р. А. Скотти “Vanished Smile” (2009).</p>`;
let i=0,h=3,hints=0,log=[],locked=false;
const $=id=>document.getElementById(id);
const gap=(s,f)=>s.g.includes("___")?s.g.replace("___",'<span class="gap">'+(f?s.o[s.c]:"&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;")+"</span>"):s.g;
const SS="speechSynthesis" in window,PITCH=.9;let SND=true,TOK=0,VOICE=null;
function chooseVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
 const pref=["Google UK English Male","Microsoft Guy","Microsoft Davis","Microsoft Christopher","Microsoft Eric","Alex","Aaron","Evan","Daniel","Fred","Microsoft David","Microsoft Mark","Arthur","Tom"];
 VOICE=null;for(const n of pref){const v=vs.find(x=>x.name.includes(n));if(v){VOICE=v;break}}
 VOICE=VOICE||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs[0]||null}
if(SS){chooseVoice();speechSynthesis.onvoiceschanged=chooseVoice}
function speak(seq){if(!SS||!SND)return;speechSynthesis.cancel();const tk=++TOK;let k=0;
 const go=()=>{if(tk!==TOK||k>=seq.length)return;const p=seq[k++];
  setTimeout(()=>{if(tk!==TOK)return;const u=new SpeechSynthesisUtterance(p.t);u.lang="en-US";if(VOICE)u.voice=VOICE;u.rate=p.r;u.pitch=p.p||PITCH;u.volume=1;u.onend=go;u.onerror=go;speechSynthesis.speak(u)},p.d||0)};go()}
function seqFor(s){const o=[],cl=x=>x.replace(/[“”"]/g,"").trim();
 (s.t.match(/[^.!?]+[.!?]*”?\s*/g)||[s.t]).forEach(x=>{const q=x.trim().startsWith("“"),e=x.includes("!"),w=x.includes("?");
  o.push({t:x,r:e?.84:.78,p:PITCH+(q?.1:0)+(e?.1:0)+(w?.12:0),d:300})});
 if(s.g.includes("___")){const [a,b]=s.g.split("___");if(/\w/.test(cl(a)))o.push({t:cl(a),r:.78,p:PITCH+.05,d:600});if(/\w/.test(cl(b)))o.push({t:cl(b),r:.78,p:PITCH+.05,d:900})}
 else o.push({t:s.g,r:.78,p:PITCH+.12,d:600});
 return o}
const vp=s=>s.sp||s.o[s.c].toLowerCase();
function buzz(){try{const H=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback;if(H){H.notificationOccurred("success");return}}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([40,40,70])}catch(e){}}
window.addEventListener("load",()=>{try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}});
function start(){i=0;h=3;hints=0;log=[];show()}
function show(){
 const s=S[i];locked=false;let hinted=false;
 $("app").innerHTML=`<div class="bar"><span>Scene ${i+1} of ${S.length}</span><span class="hr">${"♥".repeat(h)+"♡".repeat(3-h)}</span></div>
 <div class="card"><p class="st">${s.t}</p><p class="pr" id="pr">${gap(s,false)}</p><div class="hint" id="hint"></div></div>
 <div class="opts" id="o"></div><div class="row"><button id="hb">Подсказка</button><button id="ls">Слушать</button></div><div id="fb"></div>`;
 [0,1,2].map(k=>[Math.random(),k]).sort((p,q)=>p[0]-q[0]).forEach(([,k])=>{const b=document.createElement("button");b.className="opt";b.textContent=s.o[k];b.onclick=()=>pick(k,b);$("o").appendChild(b)});
 $("hb").onclick=()=>{if(!hinted){hinted=true;hints++}$("hint").textContent=s.ru};
 $("ls").onclick=()=>speak(seqFor(s));
}
function pick(k,b){
 const s=S[i];if(locked){if(k===s.c)speak([{t:vp(s),r:.7}]);return}locked=true;const ok=k===s.c;if(!ok)h--;log.push({v:s.o[s.c],ok});
 [...$("o").children].forEach(x=>{if(x.textContent===s.o[s.c])x.classList.add("good")});if(!ok)b.classList.add("bad");
 $("pr").innerHTML=gap(s,true);
 speak([{t:vp(s),r:.7}]);if(ok)buzz();
 const last=h<=0||i===S.length-1;
 $("fb").innerHTML=`<div class="fb ${ok?"g":"r"}"><b>${ok?"Correct.":"Not quite."}</b> ${ok?s.ok:s.no}${ok?"":`<br><span class="hint">Правильный ответ: <b>${s.o[s.c]}</b></span>`}<div class="fact"><b>Из дела:</b> ${s.fact}</div></div><button class="pri" id="nx">${last?"Финал":"Дальше"}</button>`;
 $("nx").onclick=()=>{if(last)end();else{i++;show()}};
}
function end(){
 const won=h>0;
 $("app").innerHTML=`<div class="card"><p class="rk">${won?"Case closed":"Case lost"}</p><p class="st">${END[h]}</p>
 <p class="rv">Жизней осталось: ${h} из 3. Подсказок использовано: ${hints}.</p><p class="rv"><b>Ваши глаголы:</b></p>
 ${log.map(x=>`<p class="rv">${x.ok?"✓":"✗"} ${x.v}</p>`).join("")}</div>
 <div class="card" style="margin-top:12px">${REVEAL}</div><button class="pri" id="rs">Играть заново</button>`;
 $("rs").onclick=start;
}
start();
</script></body></html>
